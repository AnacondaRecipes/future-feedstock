{% set version = "1.0.0" %}
{% set name = "future" %}
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bd2968309307861edae1458a4f8a4f3598c03be43b97521076aebf5d94c07b05

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vv --no-build-isolation
  entry_points:
    - futurize = libfuturize.main:main
    - pasteurize = libpasteurize.main:main

requirements:
  host:
    - python
    - setuptools
    - pip
    - wheel
  run:
    - python

test:
  imports:
    - future
    - libfuturize
    - libpasteurize
    - past
  commands:
    - pip check
    # The futurize and pasteurize commands don’t work with Python 3.13+ because the lib2to3
    # module was removed from Python, so their tests are disabled for these versions, and the package is used only for imports.
    - futurize --help # [py<313]
    - pasteurize --help # [py<313]
  requires:
    - pip

about:
  home: https://python-future.org
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Clean single-source support for Python 3 and 2
  description: |
    Python-future  is the missing compatibility layer between Python 2 and
    Python 3. It allows you to use a single, clean Python 3.x-compatible
    codebase to support both Python 2 and Python 3 with minimal overhead.
  doc_url: https://python-future.org
  dev_url: https://github.com/PythonCharmers/python-future

extra:
  recipe-maintainers:
    - jakirkham
    - mmysinger
    - ocefpaf
